version: 2

project_name: lazyssh

before:
  hooks:
    - go mod tidy

# ── Binaries ──────────────────────────────────────────────────────────────────
builds:
  - id: lazyssh
    main: ./cmd/lazyssh
    binary: lazyssh
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

# ── Archives (tar.gz / zip) ───────────────────────────────────────────────────
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - COMMERCIAL-LICENSE.md

# ── Linux packages (.deb / .rpm / .apk) ──────────────────────────────────────
nfpms:
  - id: packages
    package_name: lazyssh
    vendor: Igor Dudnyk
    homepage: https://github.com/Bestigor89/lazyssh
    maintainer: Igor Dudnyk <igordudnek@gmail.com>
    description: |
      Keyboard-driven SSH connection manager and dual-pane SFTP file browser
      for the terminal. Organize hosts in nested folders, launch SSH sessions
      or browse remote files — all without leaving your terminal.
    license: PolyForm Noncommercial 1.0.0
    formats:
      - deb     # Ubuntu, Debian
      - rpm     # RHEL, Fedora, CentOS
      - apk     # Alpine Linux
    bindir: /usr/bin
    contents:
      - src: ./README.md
        dst: /usr/share/doc/lazyssh/README.md
      - src: ./LICENSE
        dst: /usr/share/doc/lazyssh/LICENSE

# ── Homebrew tap ─────────────────────────────────────────────────────────────
# Formula is managed manually in github.com/Bestigor89/homebrew-tap
# and updated by .github/workflows/release.yml after each release.
# GoReleaser auto-generation is disabled because it produces incompatible
# define_method syntax on Homebrew 5.x.

# ── AUR (Arch Linux User Repository) ─────────────────────────────────────────
# Package name "lazyssh-bin" is AUR convention for prebuilt binary packages.
# Requires AUR_SSH_PRIVATE_KEY secret in GitHub repo settings.
# On first release, GoReleaser creates the AUR package automatically.
aurs:
  - name: lazyssh-bin
    homepage: "https://github.com/Bestigor89/lazyssh"
    description: "Keyboard-driven SSH manager and dual-pane SFTP file browser for the terminal"
    maintainers:
      - "Igor Dudnyk <igordudnek@gmail.com>"
    license: "PolyForm-Noncommercial-1.0.0"
    private_key: "{{ .Env.AUR_SSH_PRIVATE_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/lazyssh-bin.git"
    skip_upload: auto
    provides:
      - lazyssh
    conflicts:
      - lazyssh
    package: |-
      install -Dm755 "${srcdir}/lazyssh" "${pkgdir}/usr/bin/lazyssh"
      install -Dm644 "${srcdir}/README.md" "${pkgdir}/usr/share/doc/lazyssh/README.md"
      install -Dm644 "${srcdir}/LICENSE" "${pkgdir}/usr/share/licenses/lazyssh/LICENSE"

# ── Checksums ─────────────────────────────────────────────────────────────────
checksum:
  name_template: "checksums.txt"

# ── Changelog ─────────────────────────────────────────────────────────────────
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
