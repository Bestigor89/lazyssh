name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"

          # Download checksums
          CHECKSUMS=$(curl -sL "https://github.com/Bestigor89/lazyssh/releases/download/${TAG}/checksums.txt")

          SHA_DARWIN_ARM64=$(echo "$CHECKSUMS" | grep "darwin_arm64.tar.gz" | awk '{print $1}')
          SHA_DARWIN_AMD64=$(echo "$CHECKSUMS" | grep "darwin_amd64.tar.gz" | awk '{print $1}')
          SHA_LINUX_ARM64=$(echo "$CHECKSUMS"  | grep "linux_arm64.tar.gz"  | awk '{print $1}')
          SHA_LINUX_AMD64=$(echo "$CHECKSUMS"  | grep "linux_amd64.tar.gz"  | awk '{print $1}')

          FORMULA=$(cat <<RUBY
# typed: false
# frozen_string_literal: true

class Lazyssh < Formula
  desc "Keyboard-driven SSH manager and dual-pane SFTP file browser for the terminal"
  homepage "https://github.com/Bestigor89/lazyssh"
  version "${VERSION}"
  license "PolyForm-Noncommercial-1.0.0"

  if OS.mac? && Hardware::CPU.arm?
    url "https://github.com/Bestigor89/lazyssh/releases/download/${TAG}/lazyssh_${VERSION}_darwin_arm64.tar.gz"
    sha256 "${SHA_DARWIN_ARM64}"
  elsif OS.mac?
    url "https://github.com/Bestigor89/lazyssh/releases/download/${TAG}/lazyssh_${VERSION}_darwin_amd64.tar.gz"
    sha256 "${SHA_DARWIN_AMD64}"
  elsif Hardware::CPU.arm?
    url "https://github.com/Bestigor89/lazyssh/releases/download/${TAG}/lazyssh_${VERSION}_linux_arm64.tar.gz"
    sha256 "${SHA_LINUX_ARM64}"
  else
    url "https://github.com/Bestigor89/lazyssh/releases/download/${TAG}/lazyssh_${VERSION}_linux_amd64.tar.gz"
    sha256 "${SHA_LINUX_AMD64}"
  end

  def install
    bin.install "lazyssh"
  end

  test do
    assert_match version.to_s, shell_output("#{bin}/lazyssh --version")
  end
end
RUBY
          )

          # Get current file SHA from homebrew-tap
          FILE_SHA=$(curl -sL \
            -H "Authorization: Bearer ${HOMEBREW_TAP_GITHUB_TOKEN}" \
            "https://api.github.com/repos/Bestigor89/homebrew-tap/contents/Formula/lazyssh.rb" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")

          # Push updated formula
          ENCODED=$(echo "$FORMULA" | base64 -w 0)
          curl -sL -X PUT \
            -H "Authorization: Bearer ${HOMEBREW_TAP_GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Bestigor89/homebrew-tap/contents/Formula/lazyssh.rb" \
            -d "{\"message\":\"Update lazyssh to ${VERSION}\",\"content\":\"${ENCODED}\",\"sha\":\"${FILE_SHA}\"}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Formula updated:', d['commit']['sha'])"
